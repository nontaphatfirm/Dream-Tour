name: Sync product branch to Hugging Face

on:
  push:
    branches: [product] # branch for deployment
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          # ลบ fetch-depth: 0 ออกไปได้เลยครับ
          
      - name: Push latest state to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. ลบประวัติ Git เก่าทิ้ง (ลบเฉพาะในเซิร์ฟเวอร์ที่รัน Action ไม่กระทบเครื่องคุณ)
          rm -rf .git
          
          # 2. เริ่มต้น Git ใหม่ที่สะอาดเอี่ยม
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b main
          
          # 3. Add และ Commit เฉพาะไฟล์ที่มีอยู่ ณ ปัจจุบัน
          git add .
          git commit -m "Deploy latest version to Hugging Face"
          
          # 4. บังคับส่งไฟล์ชุดใหม่นี้ไปทับที่ Hugging Face เลย
          git push --force https://YOUR_HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/YOUR_HF_USERNAME/YOUR_SPACE_NAME main